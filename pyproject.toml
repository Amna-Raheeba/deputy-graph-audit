[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deputy-graph-audit"
version = "0.1.0"
description = "Offline provenance-graph auditor for agent tool-call traces: finds confused-deputy privilege escalations that per-call permission checks miss."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
